    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            background-color: #f4f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: #131313;
        }

        .card-container {
            width: 3.5in;
            height: 2in;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid #e6e4de;
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: #FF4A1F;
        }
        
        .name-info {
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .name {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #FF4A1F;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .company {
            font-size: 0.7rem;
            font-weight: 400;
            color: #6F6E6A;
            margin-top: 2px;
        }

        .divider {
            height: 1px;
            background: #f0f0f0;
            margin: 16px 0;
            width: 100%;
            z-index: 2;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
        }

        .contact-info {
            font-size: 0.65rem;
            color: #2A2A28;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            width: 12px;
            height: 12px;
            opacity: 0.6;
        }

        .qr-code svg {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            padding: 4px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }

        .decor {
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255,74,31,0.08) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
